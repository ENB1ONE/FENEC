<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Rich Gold Metallic Gradients -->
    <linearGradient id="sqGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <!-- Deep Academic Navy Background Gradient -->
    <linearGradient id="sqNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="sqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#EAB308" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Square with Gold Border -->
  <rect x="36" y="36" width="440" height="440" rx="92" 
        fill="url(#sqNavy)" 
        stroke="url(#sqGold)" 
        stroke-width="18" 
        filter="url(#sqGlow)" />

  <!-- Inner Gold Hairline Inset -->
  <rect x="56" y="56" width="400" height="400" rx="74" 
        fill="none" 
        stroke="url(#sqGold)" 
        stroke-width="3.5" 
        stroke-opacity="0.85" />

  <!-- 4-Point Star of Excellence at Top Apex -->
  <g transform="translate(256, 110)">
    <path d="M0 -24 L6 -6 L24 0 L6 6 L0 24 L-6 6 L-24 0 L-6 -6 Z" fill="#FEF08A" />
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Institutional Monogram "F" in Gold -->
  <g>
    <!-- Vertical Pillar -->
    <rect x="196" y="154" width="52" height="236" rx="8" fill="url(#sqGold)" />

    <!-- Top Arm -->
    <rect x="248" y="154" width="88" height="60" rx="8" fill="#FACC15" />

    <!-- Mid Arm -->
    <rect x="248" y="256" width="66" height="50" rx="8" fill="url(#sqGold)" />
  </g>
</svg>
