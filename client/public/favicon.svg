<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Rich Gold Metallic Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <!-- Deep Academic Navy Background Gradient -->
    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="35%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Diagonal Crystal Sheen -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#EAB308" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Majestic Heraldic Shield -->
  <path d="M256 36 C376 36 448 68 448 168 C448 308 356 418 256 468 C156 418 64 308 64 168 C64 68 136 36 256 36 Z" 
        fill="url(#shieldNavy)" 
        stroke="url(#goldGradient)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#royalGlow)" />

  <!-- Inner Gold Inset Hairline -->
  <path d="M256 58 C358 58 424 86 424 172 C424 294 344 394 256 438 C168 394 88 294 88 172 C88 86 154 58 256 58 Z" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="2.5" 
        stroke-opacity="0.55" />

  <!-- Glass/Sheen Top-Left Reflection -->
  <path d="M256 42 C362 42 434 72 434 164 C434 235 390 310 320 360 L180 120 C206 66 232 42 256 42 Z" 
        fill="url(#sheen)" />

  <!-- Star of Wisdom & Academic Excellence (Apex) -->
  <g transform="translate(256, 104)">
    <path d="M0 -22 L6 -6 L22 0 L6 6 L0 22 L-6 6 L-22 0 L-6 -6 Z" fill="url(#goldGradient)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Institutional Monogram "F" with Refined Academic Proportions -->
  <g transform="translate(182, 142)">
    <!-- Main Vertical Column -->
    <path d="M14 12 C14 5 19 0 26 0 L68 0 C75 0 80 5 80 12 L80 236 C80 243 75 248 68 248 L26 248 C19 248 14 243 14 236 Z" 
          fill="url(#goldGradient)" />

    <!-- Top Horizontal Crossbar -->
    <path d="M80 0 L154 0 C162 0 168 6 166 14 L160 48 C158 54 152 60 144 60 L80 60 Z" 
          fill="url(#goldGradient)" />

    <!-- Middle Horizontal Crossbar (Slightly shorter, dynamic chevron taper) -->
    <path d="M80 102 L132 102 C140 102 146 108 144 116 L138 142 C136 148 130 152 122 152 L80 152 Z" 
          fill="url(#goldGradient)" />

    <!-- Bevel & Chiseled Highlights for 3D Relief -->
    <path d="M22 6 L64 6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5" />
    <path d="M86 6 L148 6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5" />
    <path d="M86 108 L128 108" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5" />
    <path d="M22 14 L22 232" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.2" />
  </g>

  <!-- Academic Laurels (Folhas de Louro Clássicas) -->
  <g fill="url(#goldGradient)" opacity="0.95">
    <!-- Left Branch -->
    <g>
      <!-- Stem -->
      <path d="M120 310 C136 350 174 384 220 404" fill="none" stroke="url(#goldGradient)" stroke-width="3.5" stroke-linecap="round" />
      <!-- Leaves -->
      <path d="M112 296 C116 288 126 288 132 296 C134 306 124 314 112 296 Z" />
      <path d="M126 322 C134 316 142 320 144 330 C144 340 134 344 126 322 Z" />
      <path d="M146 348 C156 342 164 348 166 358 C166 368 154 372 146 348 Z" />
      <path d="M172 370 C182 366 190 372 192 382 C190 392 178 394 172 370 Z" />
      <path d="M202 388 C212 386 220 392 220 402 C218 410 208 412 202 388 Z" />
    </g>

    <!-- Right Branch -->
    <g>
      <!-- Stem -->
      <path d="M392 310 C376 350 338 384 292 404" fill="none" stroke="url(#goldGradient)" stroke-width="3.5" stroke-linecap="round" />
      <!-- Leaves -->
      <path d="M400 296 C396 288 386 288 380 296 C378 306 388 314 400 296 Z" />
      <path d="M386 322 C378 316 370 320 368 330 C368 340 378 344 386 322 Z" />
      <path d="M366 348 C356 342 348 348 346 358 C346 368 358 372 366 348 Z" />
      <path d="M340 370 C330 366 322 372 320 382 C322 392 334 394 340 370 Z" />
      <path d="M310 388 C300 386 292 392 292 402 C294 410 304 412 310 388 Z" />
    </g>
  </g>
</svg>