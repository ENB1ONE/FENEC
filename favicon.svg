<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square with Gold Border -->
  <rect x="36" y="36" width="440" height="440" rx="92" 
        fill="url(#favNavy)" 
        stroke="url(#favGold)" 
        stroke-width="20" />

  <!-- Inner Gold Hairline Inset -->
  <rect x="56" y="56" width="400" height="400" rx="74" 
        fill="none" 
        stroke="url(#favGold)" 
        stroke-width="4" 
        stroke-opacity="0.85" />

  <!-- Star at Top -->
  <g transform="translate(256, 110)">
    <path d="M0 -24 L6 -6 L24 0 L6 6 L0 24 L-6 6 L-24 0 L-6 -6 Z" fill="#FEF08A" />
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Monogram F -->
  <g>
    <rect x="196" y="154" width="52" height="236" rx="8" fill="url(#favGold)" />
    <rect x="248" y="154" width="88" height="60" rx="8" fill="#FACC15" />
    <rect x="248" y="256" width="66" height="50" rx="8" fill="url(#favGold)" />
  </g>
</svg>
